{% load static %}

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description"
          content="Luma Learning — a modern Django learning management system. Explore practical programming, data, and AI courses.">
    <title>{% block title %}Luma Learning · Make room for your next chapter{% endblock %}</title>
    <link rel="icon"
          type="image/svg+xml"
          href="{% static 'images/favicon.svg' %}">
    <link rel="stylesheet" href="{% static 'vendor/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <script src="{% static 'vendor/bootstrap.bundle.min.js' %}" defer></script>
    <script src="{% static 'js/app.js' %}" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    {% include "includes/navbar.html" %}
    {% include "includes/messages.html" %}
    <main id="main">
      {% block content %}{% endblock %}
    </main>
    {% include "includes/footer.html" %}
  </body>
</html>
