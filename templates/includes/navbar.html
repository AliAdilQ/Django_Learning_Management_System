<header class="site-header">
  <nav class="navbar navbar-expand-lg container"
       aria-label="Main navigation">
    <a class="brand" href="{% url 'core:home' %}">
      <span class="brand-mark" aria-hidden="true">✳</span> luma<span class="brand-dot">.</span>
      <span class="brand-sub">LEARNING</span>
    </a>
    <button class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#main-nav"
            aria-controls="main-nav"
            aria-expanded="false"
            aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="main-nav">
      <ul class="navbar-nav mx-auto gap-lg-4">
        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}"
             href="{% url 'core:home' %}">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.url_name == 'list' %}active{% endif %}"
             href="{% url 'courses:list' %}">Explore courses</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'courses:categories' %}">Categories</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'core:about' %}">About</a>
        </li>
      </ul>
      <div class="nav-actions">
        {% if user.is_authenticated %}
          <a href="{% url 'core:dashboard' %}"
             class="btn btn-primary btn-sm">Dashboard <span aria-hidden="true">↗</span>
          </a>
          <a href="{% url 'accounts:profile' %}"
             class="avatar avatar-sm"
             aria-label="Your profile">{{ user.initials }}</a>
          <form action="{% url 'accounts:logout' %}" method="post">
            {% csrf_token %}
            <button class="nav-link small" type="submit">Log out</button>
          </form>
        {% else %}
          <a href="{% url 'accounts:login' %}" class="nav-link">Log in</a>
          <a href="{% url 'accounts:register' %}"
             class="btn btn-primary btn-sm">Get started <span aria-hidden="true">↗</span>
          </a>
        {% endif %}
      </div>
    </div>
  </nav>
</header>
